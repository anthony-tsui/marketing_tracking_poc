[project]
name = "martech-rag"
version = "0.1.0"
description = "GA4/GTM Marketing Tracking RAG PoC with Crawl4AI, Notion, LangChain, Chroma, Gradio"
readme = "README.md"
authors = [
    { name = "Anthony", email = "tsuithanthony@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.6.0",
    "chromadb>=0.5.0",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "notion-client>=2.2.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[project.scripts]
martech-rag-app = "martech_rag.apps.gradio_app:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
